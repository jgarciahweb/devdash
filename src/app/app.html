<main class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">

  <header class="max-w-6xl mx-auto pt-10 pb-6 px-4 border-b border-slate-200/60 dark:border-slate-800/60 flex justify-between items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">DevDash Workspace</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Tu central de productividad personal.</p>
    </div>

    <app-button variant="secondary" (btnClick)="themeService.toggleTheme()">
          <span class="flex items-center gap-2 text-sm">
            {{ themeService.darkMode() ? '☀️ Modo Claro' : '🌙 Modo Oscuro' }}
          </span>
    </app-button>
  </header>

  <section class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 items-start mt-6">
    <div class="md:col-span-2 space-y-6">
      <app-github-widget></app-github-widget>
    </div>
    <div class="space-y-6">
      <app-pomodoro></app-pomodoro>
    </div>
  </section>

</main>
