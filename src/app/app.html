<main class="min-h-screen bg-slate-50/50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 relative selection:bg-blue-500/20">

  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-[300px] bg-gradient-to-b from-blue-500/5 to-transparent dark:from-blue-500/10 pointer-events-none blur-3xl"></div>

  <nav class="sticky top-0 z-40 w-full border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md transition-colors">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">

      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20 text-sm">
          ⚡
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-slate-900 dark:text-white">DevDash</h1>
          <p class="text-[11px] text-slate-400 font-medium hidden sm:block -mt-0.5">Workspace Personal</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button
          (click)="themeService.toggleTheme()"
          class="inline-flex items-center justify-center p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-all text-slate-600 dark:text-slate-300 active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
          [title]="themeService.darkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        >
              <span class="text-sm">
                {{ themeService.darkMode() ? '☀️' : '🌙' }}
              </span>
        </button>
      </div>

    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">

    <header class="mb-8">
      <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">¡Hola de nuevo! 👋</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Aquí tienes el estado de tu entorno de desarrollo para hoy.</p>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

      <div class="lg:col-span-2 space-y-6">
        <app-github-widget class="block transform transition-all duration-300 hover:translate-y-[-2px]"></app-github-widget>
        <app-kanban class="block transform transition-all duration-300 hover:translate-y-[-2px]"></app-kanban>
      </div>

      <div class="space-y-6 lg:sticky lg:top-22">
        <app-weather class="block transform transition-all duration-300 hover:translate-y-[-2px]"></app-weather>
        <app-pomodoro class="block transform transition-all duration-300 hover:translate-y-[-2px]"></app-pomodoro>
      </div>

    </section>
  </div>

</main>
