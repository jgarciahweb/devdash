<app-card title="Últimos Repositorios GitHub">

  <div class="flex gap-2 mb-4 pb-4 border-b border-slate-100 dark:border-slate-800/60">
    <div class="relative flex-1">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs font-mono">
        &#64;
      </span>
      <input
        type="text"
        [(ngModel)]="searchInputValue"
        placeholder="Usuario de GitHub..."
        class="w-full pl-7 pr-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 font-medium"
        (keyup.enter)="updateUser()"
      />
    </div>
    <app-button variant="primary" size="sm" (btnClick)="updateUser()">
      Buscar
    </app-button>
  </div>

  <div *ngIf="reposQuery.isPending()" class="space-y-3 animate-pulse">
    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
    <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
  </div>

  <div *ngIf="reposQuery.isError()" class="text-center py-6">
    <p class="text-sm text-red-500 font-medium">No se encontró el usuario "{{ username() }}"</p>
    <p class="text-xs text-slate-400 mt-1">Asegúrate de que el nombre esté bien escrito.</p>
  </div>

  <div *ngIf="reposQuery.data() as repos">
    <div *ngIf="repos.length > 0" class="divide-y divide-slate-100 dark:divide-slate-700/50">
      <div *ngFor="let repo of repos" class="py-3 first:pt-0 last:pb-0 group">
        <div class="flex items-center justify-between">
          <a
            [href]="repo.html_url"
            target="_blank"
            rel="noopener noreferrer"
            class="text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline group-hover:text-blue-700"
          >
            {{ repo.name }}
          </a>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200 dark:bg-amber-500/10 dark:text-amber-400 dark:border-amber-500/20">
            ⭐ {{ repo.stargazers_count }}
          </span>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">
          {{ repo.description || 'Sin descripción disponible.' }}
        </p>
        <div class="mt-2 flex items-center gap-2" *ngIf="repo.language">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span>
          <span class="text-[11px] text-slate-400 font-medium">{{ repo.language }}</span>
        </div>
      </div>
    </div>

    <p *ngIf="repos.length === 0" class="text-sm text-slate-400 text-center py-6">
      Este usuario no tiene repositorios públicos.
    </p>
  </div>

</app-card>
