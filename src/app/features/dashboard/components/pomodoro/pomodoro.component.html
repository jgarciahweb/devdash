<app-card [title]="isBreak() ? 'Descanso' : 'Tiempo de Enfoque'">
  <div class="flex flex-col items-center justify-center py-6 text-center">

    <div
      class="w-40 h-40 rounded-full border-4 flex flex-col items-center justify-center transition-all duration-300 shadow-inner"
      [ngClass]="{
        'border-red-500 bg-red-50/30 dark:bg-red-950/10 text-red-600 dark:text-red-400': !isBreak(),
        'border-emerald-500 bg-emerald-50/30 dark:bg-emerald-950/10 text-emerald-600 dark:text-emerald-400': isBreak()
      }"
    >
      <span class="text-4xl font-mono font-bold tracking-tight">
        {{ displayTime() }}
      </span>
      <span class="text-xs uppercase font-semibold tracking-wider opacity-70 mt-1">
        {{ isRunning() ? 'Activo' : 'Pausado' }}
      </span>
    </div>

    <div class="flex items-center gap-3 mt-6">

      <app-button
        [variant]="isBreak() ? 'primary' : 'danger'"
        (btnClick)="toggleTimer()"
      >
        {{ isRunning() ? 'Pausar' : 'Iniciar' }}
      </app-button>

      <app-button
        variant="secondary"
        (btnClick)="resetTimer()"
      >
        Reiniciar
      </app-button>

    </div>

  </div>
</app-card>
