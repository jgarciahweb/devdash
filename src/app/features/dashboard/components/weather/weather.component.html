<app-card title="Estado del Clima">

  <div *ngIf="weatherQuery.isPending()" class="flex flex-col items-center justify-center py-6 animate-pulse space-y-3">
    <div class="w-12 h-12 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
  </div>

  <div *ngIf="weatherQuery.data() as data" class="relative overflow-hidden rounded-lg p-1">

    <div class="flex items-center justify-between">

      <div class="flex items-center gap-4">
      <span class="text-4xl">
        {{ weatherService.getWeatherDescription(data.current.weather_code).icon }}
      </span>
        <div>
          <h4 class="text-2xl font-bold font-mono tracking-tight text-slate-800 dark:text-white">
            {{ data.current.temperature_2m }}°C
          </h4>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
            {{ weatherService.getWeatherDescription(data.current.weather_code).text }}
          </p>
        </div>
      </div>

      <div class="text-right space-y-1 text-xs text-slate-500 dark:text-slate-400 font-medium">
        <div class="flex items-center justify-end gap-1">
          💧 <span>Hum: {{ data.current.relative_humidity_2m }}%</span>
        </div>
        <div class="flex items-center justify-end gap-1">
          💨 <span>Viento: {{ data.current.wind_speed_10m }} km/h</span>
        </div>
      </div>

    </div>

  </div>
</app-card>
