<div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/50 rounded-xl shadow-sm overflow-hidden transition-all duration-200">

  <!-- Encabezado de la tarjeta (solo si tiene título) -->
  <div *ngIf="title()" class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/50 bg-slate-50/50 dark:bg-slate-800/50">
    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200 tracking-wide uppercase">
      {{ title() }}
    </h3>
  </div>

  <!-- Cuerpo de la tarjeta -->
  <div class="p-5 text-slate-600 dark:text-slate-300">
    <ng-content></ng-content>
  </div>

</div>
